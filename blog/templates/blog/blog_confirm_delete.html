{% extends 'base.html' %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>Вы действительно хотите удалить статью "{{ object.title }}"?</p>
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
