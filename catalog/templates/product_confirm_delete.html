{% extends 'base.html' %}

{% block content %}
<div class="col-6 mx-auto mt-5">
    <div class="card shadow">
        <div class="card-body text-center">
            <h3>Удаление товара</h3>
            <p>Вы уверены, что хотите удалить <strong>{{ object.name }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
