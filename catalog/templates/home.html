{% extends 'base.html' %} <!-- Наследуемся от базового шаблона -->

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Каталог товаров</h1>
</div>

    <div class="row text-center">
    {% for product in products %}
    <div class="col-3">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
            </div>
            <div class="card-body">
                <div class="product-img-container mb-3">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}">
                    {% else %}
                        <img src="/static/images/no_image.png" alt="Нет фото">
                    {% endif %}
                </div>

                <h1 class="card-title pricing-card-title">{{ product.price }} руб.</h1>

                <p class="text-start m-3">
                    {{ product.description|truncatechars:100 }}
                </p>

                <div class="d-grid gap-2">
                    <a href="{% url 'product_detail' product.pk %}" class="btn btn-lg btn-outline-primary">Посмотреть</a>
                    <button type="button" class="btn btn-lg btn-primary">Купить</button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
