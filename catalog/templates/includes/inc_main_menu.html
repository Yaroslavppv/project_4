<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="container d-flex flex-wrap justify-content-start align-items-center">
    <div class="d-flex">
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'blog:list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'contacts' %}">Контакты</a>
    </div>

    <div class="ms-auto d-flex align-items-center">
        {% if user.is_authenticated %}
            <span class="text-dark me-3">Привет, {{ user.email }}!</span>
            <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">Выйти</button>
            </form>
        {% else %}
            <a class="p-2 btn btn-outline-primary me-2" href="{% url 'users:login' %}">Войти</a>
            <a class="p-2 btn btn-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </div>
</nav>
</div>
