{% extends 'base.html' %}

{% block content %}
<div class="col-12">
    <div class="row">
        <div class="col-6 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h3 class="card-title">
                        {% if object %} Редактирование товара {% else %} Добавление товара {% endif %}
                    </h3>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {# Вывод полей формы #}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-primary">
                            {% if object %} Сохранить {% else %} Создать {% endif %}
                        </button>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
